<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Time Since That Tag Card Harness</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <script>
      customElements.define("ha-card", class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" }).append(document.createElement("slot"));
        }
      });
    </script>
    <script src="../../custom_components/time_since_that/frontend/time-since-that-card.js"></script>
    <time-since-that-card id="card"></time-since-that-card>
    <script>
      const calls = [];
      const historyCalls = [];
      const completionHistory = {
        "sensor.time_since_that_scoop_cat_litter": [
          { event_id: "litter-recent", completed_at: "2026-07-24T14:45:00Z" },
          { event_id: "litter-earlier", completed_at: "2026-07-15T14:45:00Z" },
        ],
      };
      const card = document.querySelector("#card");
      card.setConfig({ title: "Household" });
      card.hass = {
        states: {
          "sensor.time_since_that_take_bins_out": {
            state: "7 days since",
            attributes: {
              chore_id: "take_bins_out",
              friendly_chore_name: "Take bins out",
              elapsed_value: 7,
              last_done_at: "2026-07-19T14:45:00Z",
              recommended_every: "1 week",
              recommended_every_value: 1,
              recommended_every_unit: "weeks",
              completion_count: 1,
              average_interval: null,
              over_recommended: true,
              over_by: "3 days",
              tags: ["household"],
            },
          },
          "sensor.time_since_that_scoop_cat_litter": {
            state: "2 days since",
            attributes: {
              chore_id: "scoop_cat_litter",
              friendly_chore_name: "Scoop cat litter",
              elapsed_value: 2,
              last_done_at: "2026-07-24T14:45:00Z",
              recommended_every: "2 weeks",
              recommended_every_value: 2,
              recommended_every_unit: "weeks",
              completion_count: 2,
              average_interval: "9 days",
              over_recommended: false,
              tags: ["pets", "daily"],
            },
          },
          "sensor.time_since_that_refill_humidifier": {
            state: "12 hours since",
            attributes: {
              chore_id: "refill_humidifier",
              friendly_chore_name: "Refill humidifier",
              elapsed_value: 12,
              last_done_at: "2026-07-26T02:45:00Z",
              recommended_every: "1 month",
              recommended_every_value: 1,
              recommended_every_unit: "months",
              completion_count: 3,
              average_interval: "12 days",
              over_recommended: false,
              tags: [],
            },
          },
        },
        callService: async (...args) => calls.push(args),
        connection: {
          sendMessagePromise: async (message) => {
            historyCalls.push(message);
            if (message.type === "time_since_that/completion_history") {
              return { events: completionHistory[message.entity_id] || [] };
            }
            if (message.type === "time_since_that/update_completion") {
              const events = completionHistory[message.entity_id] || [];
              const index = events.findIndex((event) => event.event_id === message.event_id);
              const updated = { event_id: message.event_id, completed_at: message.completed_at };
              if (index >= 0) events[index] = updated;
              return updated;
            }
            if (message.type === "time_since_that/delete_completion") {
              const events = completionHistory[message.entity_id] || [];
              completionHistory[message.entity_id] = events.filter((event) => event.event_id !== message.event_id);
              return { event_id: message.event_id };
            }
            throw new Error("Unexpected WebSocket command");
          },
        },
      };
      window.cardHarness = {
        card,
        calls,
        historyCalls,
        filterState: () => [...card.shadowRoot.querySelectorAll(".filter-button")].map((button) => ({
          label: button.textContent,
          pressed: button.getAttribute("aria-pressed"),
        })),
        names: () => [...card.shadowRoot.querySelectorAll(".item__name")].map((element) => element.textContent),
        details: () => [...card.shadowRoot.querySelectorAll(".item")].map((item) => ({
          name: item.querySelector(".item__name").textContent,
          lastDone: item.querySelector(".item__state").textContent,
          pills: [...item.querySelectorAll(".pill")].map((pill) => ({
            text: pill.textContent,
            label: pill.getAttribute("aria-label"),
          })),
        })),
        setLastDone: (entity, lastDoneAt) => {
          card._hass.states[entity].attributes.last_done_at = lastDoneAt;
          card.hass = card._hass;
        },
        clickFilter: (label) => [...card.shadowRoot.querySelectorAll(".filter-button")].find((button) => button.textContent === label).click(),
        pressFirst: async () => {
          card.shadowRoot.querySelector(".mark-button").click();
          await new Promise((resolve) => setTimeout(resolve, 0));
          return calls;
        },
      };
    </script>
  </body>
</html>
